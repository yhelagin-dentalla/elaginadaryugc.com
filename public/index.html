<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daria Elagina | UGC Creator</title>
  <meta name="description" content="Austria-based lifestyle &amp; UGC creator: beauty, fashion, experiences and food &amp; drinks content for brands.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Daria Elagina | UGC Creator">
  <meta property="og:image" content="/assets/img/photo1.jpg">
  <meta name="theme-color" content="#502615">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/pinyon-script-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/fonts.css?v=5">
  <link rel="preload" as="image" href="/assets/img/photo1.jpg">
  <link rel="stylesheet" href="/assets/css/site.css?v=5">
</head>
<body>
  <a class="skip-link" href="#portfolio">Skip to content</a>

  <header class="nav-wrap">
    <div class="nav" id="nav">
      <a class="logo" href="#home" data-bind="site.name">Daria Elagina</a>
      <nav class="nav-links" aria-label="Main">
        <a href="#home">Home</a>
        <a href="#portfolio">Videography</a>
        <a href="#photography">Photography</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu" hidden>
    <a href="#home">Home</a>
    <a href="#portfolio">Videography</a>
    <a href="#photography">Photography</a>
    <a href="#contact">Contact</a>
  </div>

  <main>
    <!-- HERO / ABOUT -->
    <section class="hero" id="home">
      <div class="hero-photo">
        <img id="heroImg" src="/assets/img/photo1.jpg" alt="" fetchpriority="high">
      </div>
      <div class="hero-text">
        <h1 class="script hero-heading" data-bind="about.heading">Hi Brands!</h1>
        <ul class="bullets" id="aboutBullets"></ul>
        <div class="pills" id="heroPills"></div>
      </div>
    </section>

    <!-- BRANDS (hidden while empty) -->
    <section class="brands" id="brands" hidden>
      <h2 class="script section-title" data-bind="brands.heading"></h2>
      <div class="brand-list" id="brandList"></div>
    </section>

    <!-- PORTFOLIO -->
    <section class="portfolio dark" id="portfolio">
      <h2 class="script section-title" data-bind="portfolio.heading">Portfolio</h2>
      <div class="filters" id="videoFilters" role="tablist" aria-label="Video categories"></div>
      <div class="video-grid" id="videoGrid"></div>
      <p class="empty-note" id="videoEmpty" hidden></p>
    </section>

    <!-- PHOTOGRAPHY -->
    <section class="photography" id="photography">
      <h2 class="script section-title" data-bind="photography.heading">Photography</h2>
      <div class="filters" id="photoFilters" hidden></div>
      <div class="photo-grid" id="photoGrid"></div>
      <p class="empty-note" id="photoEmpty" hidden></p>
    </section>

    <!-- CONTACT -->
    <section class="contact dark" id="contact">
      <div class="contact-card">
        <div class="contact-text">
          <h2 class="script contact-title" data-bind="contact.subtitle">Get in touch</h2>
          <p class="contact-heading" data-bind="contact.heading"></p>
          <div class="pills outline" id="contactPills"></div>
        </div>
        <figure class="contact-photo" id="contactPhoto"><img alt="" loading="lazy"></figure>
      </div>
      <footer class="footer">
        <span class="script footer-name" data-bind="site.name">Daria Elagina</span>
        <span>© <span id="year"></span> · UGC portfolio</span>
      </footer>
    </section>
  </main>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" aria-label="Close">×</button>
    <button class="lb-nav prev" aria-label="Previous photo"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <img alt="">
    <button class="lb-nav next" aria-label="Next photo"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <script src="/assets/js/site.js?v=5" defer></script>
</body>
</html>
